<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241242"/>
      <stop offset="50%" stop-color="#140a26"/>
      <stop offset="100%" stop-color="#080410"/>
    </linearGradient>

    <!-- Camera Gradient: Rich Rose to Purple -->
    <linearGradient id="cam-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="35%" stop-color="#ec4899"/>
      <stop offset="70%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Audio Waveform Gradient: Cyan to Purple -->
    <linearGradient id="wave-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#a855f7" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg-grad)" stroke="#a855f7" stroke-width="4" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="190" fill="url(#center-glow)"/>

  <!-- Left: Audio Frequency Waveform Bars (Voice & Acoustic Input) -->
  <g filter="url(#glow-shadow)" fill="url(#wave-grad)" transform="translate(-21 -2)">
    <rect x="62" y="232" width="16" height="48" rx="8"/>
    <rect x="88" y="196" width="16" height="120" rx="8"/>
    <rect x="114" y="166" width="16" height="180" rx="8"/>
  </g>

  <!-- Center: Video Camera (Live Video Call) -->
  <g filter="url(#glow-shadow)" transform="translate(-17 -1)">
    <!-- Main Camera Body -->
    <rect x="144" y="156" width="186" height="200" rx="40" fill="url(#cam-grad)"/>

    <!-- Camera Lens Projection Triangle / Cone -->
    <path d="M 330 214 L 396 172 C 404 167 414 173 414 182 L 414 330 C 414 339 404 345 396 340 L 330 298 Z" fill="url(#cam-grad)"/>

    <!-- Camera Outer Lens Rim -->
    <circle cx="237" cy="256" r="56" fill="#0d071a" stroke="#ffffff" stroke-width="6" stroke-opacity="0.95"/>
    <circle cx="237" cy="256" r="42" fill="url(#bg-grad)"/>

    <!-- Integrated Audio Microphone Emblem inside Lens -->
    <!-- Mic Capsule -->
    <rect x="229" y="226" width="16" height="28" rx="8" fill="#38bdf8"/>
    <!-- Mic U-Bracket -->
    <path d="M 221 248 C 221 265 253 265 253 248" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Mic Stem & Stand -->
    <line x1="237" y1="265" x2="237" y2="276" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="229" y1="276" x2="245" y2="276" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Right: Radiating Sound & Audio Broadcast Waves -->
  <g filter="url(#glow-shadow)" transform="translate(-20 0)">
    <!-- Inner Sound Wave Arc -->
    <path d="M 436 216 A 58 58 0 0 1 436 296" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <!-- Outer Sound Wave Arc -->
    <path d="M 464 192 A 92 92 0 0 1 464 320" fill="none" stroke="#a855f7" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>