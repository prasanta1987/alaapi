<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Luxury Obsidian-Violet Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e103a"/>
      <stop offset="50%" stop-color="#0f0720"/>
      <stop offset="100%" stop-color="#05020c"/>
    </linearGradient>

    <!-- Border Subtle Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Camera Gradient: Indigo -> Electric Violet -> Vibrant Magenta/Rose -->
    <linearGradient id="cam-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="35%" stop-color="#8b5cf6"/>
      <stop offset="70%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Camera Top Specular Highlight -->
    <linearGradient id="cam-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Lens Glass Depth Gradient -->
    <radialGradient id="lens-depth" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#090514"/>
      <stop offset="100%" stop-color="#020108"/>
    </radialGradient>

    <!-- Sound Wave Cyan Gradient -->
    <linearGradient id="wave-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>

    <!-- Ambient Glow behind Camera -->
    <radialGradient id="ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.42"/>
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter for Camera -->
    <filter id="cam-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8b5cf6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- PWA Squircle App Icon Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="4"/>
  <circle cx="256" cy="256" r="185" fill="url(#ambient-glow)"/>

  <!-- Centered Video Calling Camera Group -->
  <g filter="url(#cam-shadow)">
    <!-- Main Camera Body with Rounded Edges -->
    <rect x="112" y="168" width="196" height="176" rx="42" fill="url(#cam-grad)"/>

    <!-- Subtle Internal Top Highlight for Gloss / Depth -->
    <rect x="114" y="170" width="192" height="88" rx="40" fill="url(#cam-highlight)"/>

    <!-- Camera Projection Lens Cone -->
    <path d="M 302 216 L 386 172 C 396 167 408 174 408 186 L 408 326 C 408 338 396 345 386 340 L 302 296 Z" fill="url(#cam-grad)"/>

    <!-- Outer Lens Ring (Crisp Metallic Border) -->
    <circle cx="210" cy="256" r="52" fill="#0b0616" stroke="#ffffff" stroke-width="4.5" stroke-opacity="0.9"/>

    <!-- Inner Lens Glass -->
    <circle cx="210" cy="256" r="44" fill="url(#lens-depth)"/>

    <!-- Lens Specular Glint Reflection -->
    <path d="M 182 234 A 36 36 0 0 1 236 222" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>

    <!-- Acoustic Sound Waveform / Voice Emblem Inside Lens (Representing High-Fidelity Music Calling) -->
    <g fill="url(#wave-grad)">
      <!-- Left frequency bar -->
      <rect x="194" y="246" width="6.5" height="20" rx="3.25"/>
      <!-- Center resonant vocal bar -->
      <rect x="206.75" y="238" width="6.5" height="36" rx="3.25"/>
      <!-- Right frequency bar -->
      <rect x="219.5" y="244" width="6.5" height="24" rx="3.25"/>
    </g>

    <!-- Live Studio Activity Indicator (Glowing Emerald Dot) -->
    <circle cx="282" cy="194" r="6" fill="#22c55e" stroke="#14532d" stroke-width="1.5"/>
    <circle cx="282" cy="194" r="3" fill="#86efac"/>
  </g>
</svg>
