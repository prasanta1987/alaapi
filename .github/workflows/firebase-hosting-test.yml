# Automatically deploy testing branch pushes to the secondary test site (https://alaapi-test.web.app)
name: Deploy to Firebase Hosting (Testing Site)
on:
  push:
    branches:
      - testing
jobs:
  build_and_deploy_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALAAPI }}
          target: test
          channelId: live
          projectId: alaapi
